name: icon
description: "Icon - Train Smarter"

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  logger: ^2.6.1
  shared_preferences: ^2.5.3
  pretty_dio_logger: ^1.4.0
  fluttertoast: ^9.0.0
  dio: ^5.9.0
  flutter_svg: ^2.2.1
  cached_network_image: ^3.4.1
  font_awesome_flutter: ^10.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true


  assets:
    - assets/images/
    - assets/svg/


  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700

  # Splash Screen
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/images/icon-splash.png
  color_dark: "#FFFFFF"
  image_dark: assets/images/icon-splash.png

  android_12:
    color: "#FFFFFF"
    image: assets/images/icon-splash.png
    image_dark: assets/images/icon-splash.png


flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon-splash.png"
  adaptive_icon_foreground: "assets/images/icon-splash.png"
  adaptive_icon_background: "#FFFFFF"
  remove_alpha_ios: true
  min_sdk_android: 21
